<!doctype html>
<html lang="en" data-blueprint="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DraftDeck</title>
    <meta name="theme-color" content="#f8fafc" />
    <link rel="manifest" href="/studio.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/studio-192.png" />
    <link rel="stylesheet" href="/shared.css" />
    <script type="module" src="/shared.bundle.js"></script>
  </head>
  <body>
    <div class="shared-shell">
      <header class="shared-top">
        <a href="/" class="wordmark" data-studio-route>DraftDeck</a>
        <div class="shared-top-actions">
          <button class="button subtle" id="studio-command" type="button" hidden>Commands</button>
          <div class="notification-anchor">
            <button
              type="button"
              class="bell-button"
              id="notification-bell"
              aria-label="Notifications"
              aria-expanded="false"
              aria-controls="notification-panel"
              hidden
            >
              <span class="bell-shape" aria-hidden="true"></span
              ><span id="notification-count" aria-hidden="true" hidden></span>
            </button>
            <section
              id="notification-panel"
              aria-labelledby="notification-title"
              hidden
            >
              <header>
                <h2 id="notification-title">Notifications</h2>
                <button
                  type="button"
                  class="notification-read"
                  id="notification-refresh"
                >
                  Refresh
                </button>
              </header>
              <div id="notification-list" aria-live="polite"></div>
            </section>
          </div>
          <div id="account"></div>
        </div>
      </header>
      <nav id="studio-global-nav" class="studio-global-nav" aria-label="Workspace" hidden>
        <a href="/" data-studio-route>Project insights</a>
        <a href="/shared" data-studio-route>Shared projects</a>
        <a href="/shared?view=portfolio" data-studio-route>Portfolio</a>
        <a href="/shared?view=usage" data-studio-route>AI usage</a>
        <a href="/shared?view=profile" data-studio-route>My profile</a>
        <a href="/shared?view=settings" data-studio-route>Settings</a>
      </nav>
      <main id="shared-main" class="shared-main">
        <div class="studio-skeleton" role="status"><span class="studio-sr">Opening your workspace</span><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i></div>
      </main>
      <div id="notice" role="status" aria-live="polite"></div>
    </div>
    <dialog id="command-dialog" aria-labelledby="command-title">
      <header><h2 id="command-title">Commands</h2><form method="dialog"><button class="button subtle">Close</button></form></header>
      <label class="studio-sr" for="command-query">Search commands and projects</label>
      <input id="command-query" type="search" placeholder="Find a command or project" maxlength="100" autofocus />
      <div id="command-results" aria-live="polite"></div>
    </dialog>
    <dialog id="shared-dialog" aria-labelledby="shared-title">
      <header>
        <h2 id="shared-title"></h2>
        <button type="button" id="shared-close" aria-label="Close">
          Close
        </button>
      </header>
      <div id="shared-dialog-body"></div>
    </dialog>
  </body>
</html>
