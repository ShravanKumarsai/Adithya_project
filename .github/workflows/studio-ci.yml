name: Studio CI
on:
  push:
    paths:
      - "aithya-studio/**"
      - ".github/workflows/studio-ci.yml"
  pull_request:
    paths:
      - "aithya-studio/**"
      - ".github/workflows/studio-ci.yml"

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aithya-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aithya-studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:unused
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && node vercel-build.mjs && node --check dist/server/index.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
